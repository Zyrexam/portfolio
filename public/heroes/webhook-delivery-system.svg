<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 400" width="1600" height="400">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1e1e1e"/><stop offset="1" stop-color="#101010"/>
    </linearGradient>
    <radialGradient id="glow" cx="64%" cy="46%" r="58%">
      <stop offset="0%" stop-color="#007acc" stop-opacity="0.18"/>
      <stop offset="55%" stop-color="#007acc" stop-opacity="0.05"/>
      <stop offset="100%" stop-color="#101010" stop-opacity="0"/>
    </radialGradient>
    <pattern id="dots" width="26" height="26" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="1" fill="#262626"/>
    </pattern>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="3" stdDeviation="5" flood-color="#000000" flood-opacity="0.55"/>
    </filter>
    <filter id="glowf" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <marker id="aw" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#9aa5b1"/>
    </marker>
  </defs>

  <rect width="1600" height="400" fill="url(#bg)"/>
  <rect width="1600" height="400" fill="url(#glow)"/>
  <rect width="1600" height="400" fill="url(#dots)"/>

  <!-- Title block -->
  <g font-family="ui-monospace, Menlo, Consolas, monospace">
    <text x="56" y="118" font-size="11" fill="#626262" letter-spacing="1.5">~/projects/webhook-delivery-system</text>
    <text x="56" y="158" font-size="27" font-weight="700" fill="#f5f5f5">Webhook Delivery System</text>
    <text x="56" y="184" font-size="13" fill="#8f8f8f">at-least-once delivery · backoff · circuit breaker · crash recovery</text>
  </g>
  <g font-family="ui-monospace, Menlo, Consolas, monospace" font-size="11">
    <rect x="56" y="202" width="86" height="22" rx="4" fill="#212121" stroke="#007acc" stroke-opacity="0.45"/>
    <text x="99" y="217" text-anchor="middle" fill="#7fb8e8">FastAPI</text>
    <rect x="152" y="202" width="92" height="22" rx="4" fill="#212121" stroke="#007acc" stroke-opacity="0.45"/>
    <text x="198" y="217" text-anchor="middle" fill="#7fb8e8">PostgreSQL</text>
    <rect x="254" y="202" width="76" height="22" rx="4" fill="#212121" stroke="#007acc" stroke-opacity="0.45"/>
    <text x="292" y="217" text-anchor="middle" fill="#7fb8e8">Redis</text>
    <rect x="340" y="202" width="76" height="22" rx="4" fill="#212121" stroke="#007acc" stroke-opacity="0.45"/>
    <text x="378" y="217" text-anchor="middle" fill="#7fb8e8">HMAC</text>
  </g>

  <!-- State machine -->
  <g font-family="ui-monospace, Menlo, Consolas, monospace">
    <g filter="url(#shadow)">
      <g transform="translate(636, 148)">
        <rect width="150" height="48" rx="6" fill="#0e639c"/>
        <rect width="150" height="4" rx="2" fill="#7fb8e8" opacity="0.8"/>
        <text x="75" y="31" text-anchor="middle" font-size="17" font-weight="600" fill="#ffffff">PENDING</text>
      </g>
      <g transform="translate(814, 148)">
        <rect width="150" height="48" rx="6" fill="#1177cc"/>
        <rect width="150" height="4" rx="2" fill="#7fb8e8" opacity="0.8"/>
        <text x="75" y="31" text-anchor="middle" font-size="17" font-weight="600" fill="#ffffff">IN FLIGHT</text>
      </g>
      <g transform="translate(992, 148)">
        <rect width="150" height="48" rx="6" fill="#14a87f"/>
        <rect width="150" height="4" rx="2" fill="#8ff0d5" opacity="0.8"/>
        <text x="75" y="31" text-anchor="middle" font-size="17" font-weight="600" fill="#07130f">DELIVERED</text>
      </g>
      <g transform="translate(1170, 148)">
        <rect width="150" height="48" rx="6" fill="#c23a3a"/>
        <rect width="150" height="4" rx="2" fill="#ff9d9d" opacity="0.8"/>
        <text x="75" y="31" text-anchor="middle" font-size="17" font-weight="600" fill="#ffffff">DEAD</text>
      </g>
      <g transform="translate(1348, 148)">
        <rect width="164" height="48" rx="6" fill="#1a1a1a" stroke="#5a5a5a" stroke-dasharray="6 4" stroke-width="1.5"/>
        <text x="82" y="31" text-anchor="middle" font-size="14" fill="#8a8a8a">retry queue</text>
      </g>
    </g>

    <!-- arrows -->
    <g stroke="#9aa5b1" stroke-width="2" fill="none">
      <line x1="786" y1="172" x2="812" y2="172" marker-end="url(#aw)"/>
      <line x1="964" y1="172" x2="990" y2="172" marker-end="url(#aw)"/>
      <line x1="1142" y1="172" x2="1168" y2="172" marker-end="url(#aw)"/>
    </g>

    <!-- retry loop: DEAD -- back --> IN FLIGHT -->
    <path d="M 1245 146 C 1245 96, 889 96, 889 146" fill="none" stroke="#f44747" stroke-width="2.5" stroke-dasharray="7 5" marker-end="url(#aw)"/>
    <text x="1067" y="96" text-anchor="middle" font-size="12" fill="#f48c8c">retry · 2s → 32s · max 5</text>

    <!-- reaper scan -->
    <g font-size="11" fill="#6e8fae">
      <circle cx="1440" cy="272" r="3" fill="#007acc"/>
      <text x="1452" y="276">crash-reaper · every 30s</text>
    </g>
  </g>

  <!-- live log panel -->
  <g transform="translate(636, 240)" filter="url(#shadow)">
    <rect width="430" height="74" rx="6" fill="#141414" stroke="#2c2c2c"/>
    <g font-family="ui-monospace, Menlo, Consolas, monospace" font-size="11">
      <rect x="0" y="0" width="430" height="22" rx="6" fill="#1d1d1d"/>
      <circle cx="14" cy="11" r="3.5" fill="#ff5f56"/>
      <circle cx="26" cy="11" r="3.5" fill="#ffbd2e"/>
      <circle cx="38" cy="11" r="3.5" fill="#27c93f"/>
      <text x="56" y="15" fill="#626262">tail -f deliveries.log</text>
    </g>
    <g font-family="ui-monospace, Menlo, Consolas, monospace" font-size="11.5">
      <circle cx="16" cy="40" r="3" fill="#4ec9b0"/>
      <text x="26" y="44" fill="#b8b8b8">12:04:11  delivery#a3f → POST 200  (attempt 1 · 21ms)</text>
      <circle cx="16" cy="60" r="3" fill="#f44747"/>
      <text x="26" y="64" fill="#b8b8b8">12:04:13  delivery#a3f → 502   (backoff 4s → attempt 2)</text>
    </g>
  </g>

  <!-- metric chips -->
  <g font-family="ui-monospace, Menlo, Consolas, monospace">
    <g transform="translate(1348, 240)">
      <rect width="164" height="30" rx="5" fill="#191919" stroke="#007acc" stroke-opacity="0.5"/>
      <text x="82" y="20" text-anchor="middle" font-size="13" fill="#8ec9f2">circuit open · 60s</text>
    </g>
    <g transform="translate(1348, 282)">
      <rect width="164" height="30" rx="5" fill="#191919" stroke="#007acc" stroke-opacity="0.5"/>
      <text x="82" y="20" text-anchor="middle" font-size="13" fill="#8ec9f2">HMAC-SHA256 signed</text>
    </g>
  </g>

  <line x1="0" y1="340" x2="1600" y2="340" stroke="#007acc" stroke-opacity="0.22" stroke-width="2"/>
</svg>