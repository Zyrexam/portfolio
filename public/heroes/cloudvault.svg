<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 400" width="1600" height="400">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1e1e1e"/><stop offset="1" stop-color="#101010"/>
    </linearGradient>
    <radialGradient id="glow" cx="64%" cy="46%" r="58%">
      <stop offset="0%" stop-color="#c586c0" stop-opacity="0.16"/>
      <stop offset="55%" stop-color="#c586c0" stop-opacity="0.05"/>
      <stop offset="100%" stop-color="#101010" stop-opacity="0"/>
    </radialGradient>
    <pattern id="dots" width="26" height="26" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="1" fill="#262626"/>
    </pattern>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="3" stdDeviation="5" flood-color="#000000" flood-opacity="0.55"/>
    </filter>
    <filter id="glowf" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="7" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <marker id="aw" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#c586c0"/>
    </marker>
  </defs>

  <rect width="1600" height="400" fill="url(#bg)"/>
  <rect width="1600" height="400" fill="url(#glow)"/>
  <rect width="1600" height="400" fill="url(#dots)"/>

  <!-- Title block -->
  <g font-family="ui-monospace, Menlo, Consolas, monospace">
    <text x="56" y="118" font-size="11" fill="#626262" letter-spacing="1.5">~/projects/cloudvault</text>
    <text x="56" y="158" font-size="27" font-weight="700" fill="#f5f5f5">CloudVault</text>
    <text x="56" y="184" font-size="13" fill="#8f8f8f">sub-500ms uploads · end-to-end encrypted · 50 concurrent users</text>
  </g>
  <g font-family="ui-monospace, Menlo, Consolas, monospace" font-size="11">
    <rect x="56" y="202" width="88" height="22" rx="4" fill="#212121" stroke="#c586c0" stroke-opacity="0.45"/>
    <text x="100" y="217" text-anchor="middle" fill="#ddb8da">Java 17</text>
    <rect x="154" y="202" width="102" height="22" rx="4" fill="#212121" stroke="#c586c0" stroke-opacity="0.45"/>
    <text x="205" y="217" text-anchor="middle" fill="#ddb8da">Spring Boot 3</text>
    <rect x="266" y="202" width="90" height="22" rx="4" fill="#212121" stroke="#c586c0" stroke-opacity="0.45"/>
    <text x="311" y="217" text-anchor="middle" fill="#ddb8da">React</text>
    <rect x="366" y="202" width="62" height="22" rx="4" fill="#212121" stroke="#c586c0" stroke-opacity="0.45"/>
    <text x="397" y="217" text-anchor="middle" fill="#ddb8da">GCP</text>
  </g>

  <!-- concurrent users -->
  <g font-family="ui-monospace, Menlo, Consolas, monospace">
    <text x="636" y="128" font-size="12" fill="#6b6b6b">50 concurrent users · 10MB files</text>
    <g fill="none" stroke="#c586c0" stroke-opacity="0.85" stroke-width="1.5">
      <circle cx="652" cy="144" r="6"/><circle cx="682" cy="144" r="6"/><circle cx="712" cy="144" r="6"/><circle cx="742" cy="144" r="6"/><circle cx="772" cy="144" r="6"/>
      <circle cx="652" cy="174" r="6"/><circle cx="682" cy="174" r="6"/><circle cx="712" cy="174" r="6"/><circle cx="742" cy="174" r="6"/><circle cx="772" cy="174" r="6"/>
      <circle cx="652" cy="204" r="6"/><circle cx="682" cy="204" r="6"/><circle cx="712" cy="204" r="6"/><circle cx="742" cy="204" r="6"/><circle cx="772" cy="204" r="6"/>
      <circle cx="652" cy="234" r="6"/><circle cx="682" cy="234" r="6"/><circle cx="712" cy="234" r="6"/><circle cx="742" cy="234" r="6"/><circle cx="772" cy="234" r="6"/>
      <circle cx="652" cy="264" r="6"/><circle cx="682" cy="264" r="6"/><circle cx="712" cy="264" r="6"/><circle cx="742" cy="264" r="6"/><circle cx="772" cy="264" r="6"/>
    </g>
    <text x="712" y="294" text-anchor="middle" font-size="12" fill="#c586c0">×50</text>
  </g>

  <!-- upload arrow + progress -->
  <g font-family="ui-monospace, Menlo, Consolas, monospace">
    <line x1="790" y1="205" x2="852" y2="205" stroke="#c586c0" stroke-width="3" marker-end="url(#aw)"/>
    <g transform="translate(636, 306)">
      <rect width="230" height="26" rx="6" fill="#1a1a1a" stroke="#3a3a3a"/>
      <rect width="138" height="26" rx="6" fill="#c586c0" opacity="0.9"/>
      <rect width="230" height="26" rx="6" fill="none" stroke="#c586c0" stroke-opacity="0.5"/>
      <text x="115" y="18" text-anchor="middle" font-size="12" fill="#0d0d0d">uploading · 60%</text>
    </g>
  </g>

  <!-- cloud + lock -->
  <g transform="translate(880, 138)" filter="url(#glowf)">
    <g fill="none" stroke="#c586c0" stroke-width="3">
      <circle cx="52" cy="42" r="16"/>
      <circle cx="82" cy="50" r="12"/>
      <rect x="38" y="44" width="56" height="24" rx="8"/>
    </g>
    <path d="M 66 52 q 4 -12 20 -12 q 16 0 20 12" fill="none" stroke="#c586c0" stroke-width="4" stroke-linecap="round"/>
    <rect x="58" y="64" width="16" height="18" rx="3" fill="#c586c0"/>
  </g>
  <g transform="translate(880, 244)" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="12.5">
    <g filter="url(#shadow)">
      <rect width="168" height="36" rx="6" fill="#0d0d0d" stroke="#c586c0" stroke-opacity="0.6"/>
      <text x="84" y="23" text-anchor="middle" fill="#ddb8da">GCP Cloud Storage</text>
    </g>
    <g filter="url(#shadow)">
      <rect x="180" width="150" height="36" rx="6" fill="#0d0d0d" stroke="#c586c0" stroke-opacity="0.45"/>
      <text x="255" y="23" text-anchor="middle" fill="#b994b6">Firebase Auth</text>
    </g>
  </g>

  <!-- metric chips -->
  <g font-family="ui-monospace, Menlo, Consolas, monospace">
    <g transform="translate(1236, 150)">
      <rect width="150" height="44" rx="6" fill="#151515" stroke="#c586c0" stroke-opacity="0.55"/>
      <text x="75" y="20" text-anchor="middle" font-size="19" font-weight="700" fill="#e6c3e3">&lt;500ms</text>
      <text x="75" y="36" text-anchor="middle" font-size="10.5" fill="#8a8a8a">upload · 10MB</text>
    </g>
    <g transform="translate(1402, 150)">
      <rect width="150" height="44" rx="6" fill="#151515" stroke="#c586c0" stroke-opacity="0.55"/>
      <text x="75" y="20" text-anchor="middle" font-size="19" font-weight="700" fill="#e6c3e3">50</text>
      <text x="75" y="36" text-anchor="middle" font-size="10.5" fill="#8a8a8a">concurrent users</text>
    </g>
    <g transform="translate(1236, 208)">
      <rect width="316" height="40" rx="6" fill="#151515" stroke="#c586c0" stroke-opacity="0.4"/>
      <text x="158" y="18" text-anchor="middle" font-size="12.5" fill="#b9b9b9">reactive multipart streaming</text>
      <text x="158" y="33" text-anchor="middle" font-size="10.5" fill="#6f6f6f">non-blocking I/O · stateless security</text>
    </g>
    <g transform="translate(1236, 262)">
      <rect width="316" height="40" rx="6" fill="#151515" stroke="#c586c0" stroke-opacity="0.4"/>
      <text x="158" y="18" text-anchor="middle" font-size="12.5" fill="#b9b9b9">ID-token verified per request</text>
      <text x="158" y="33" text-anchor="middle" font-size="10.5" fill="#6f6f6f">private buckets · keys off frontend</text>
    </g>
  </g>

  <line x1="0" y1="340" x2="1600" y2="340" stroke="#c586c0" stroke-opacity="0.22" stroke-width="2"/>
</svg>