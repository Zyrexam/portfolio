<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 400" width="1600" height="400">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1e1e1e"/><stop offset="1" stop-color="#101010"/>
    </linearGradient>
    <radialGradient id="glow" cx="64%" cy="46%" r="58%">
      <stop offset="0%" stop-color="#9cdcfe" stop-opacity="0.16"/>
      <stop offset="55%" stop-color="#9cdcfe" stop-opacity="0.05"/>
      <stop offset="100%" stop-color="#101010" stop-opacity="0"/>
    </radialGradient>
    <pattern id="dots" width="26" height="26" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="1" fill="#262626"/>
    </pattern>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="3" stdDeviation="5" flood-color="#000000" flood-opacity="0.55"/>
    </filter>
    <filter id="glowf" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="7" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="1600" height="400" fill="url(#bg)"/>
  <rect width="1600" height="400" fill="url(#glow)"/>
  <rect width="1600" height="400" fill="url(#dots)"/>

  <!-- Title block -->
  <g font-family="ui-monospace, Menlo, Consolas, monospace">
    <text x="56" y="118" font-size="11" fill="#626262" letter-spacing="1.5">~/projects/fedmeet</text>
    <text x="56" y="158" font-size="27" font-weight="700" fill="#f5f5f5">FedMeet</text>
    <text x="56" y="184" font-size="13" fill="#8f8f8f">federated multi-sensor HAR · gated fusion · ACM ICDCN ’26</text>
  </g>
  <g font-family="ui-monospace, Menlo, Consolas, monospace" font-size="11">
    <rect x="56" y="202" width="76" height="22" rx="4" fill="#212121" stroke="#9cdcfe" stroke-opacity="0.45"/>
    <text x="94" y="217" text-anchor="middle" fill="#c2e6fb">Flower</text>
    <rect x="142" y="202" width="74" height="22" rx="4" fill="#212121" stroke="#9cdcfe" stroke-opacity="0.45"/>
    <text x="179" y="217" text-anchor="middle" fill="#c2e6fb">BiLSTM</text>
    <rect x="226" y="202" width="80" height="22" rx="4" fill="#212121" stroke="#9cdcfe" stroke-opacity="0.45"/>
    <text x="266" y="217" text-anchor="middle" fill="#c2e6fb">XGBoost</text>
    <rect x="316" y="202" width="66" height="22" rx="4" fill="#212121" stroke="#9cdcfe" stroke-opacity="0.45"/>
    <text x="349" y="217" text-anchor="middle" fill="#c2e6fb">ONNX</text>
  </g>

  <!-- device cards -->
  <g transform="translate(636, 122)" font-family="ui-monospace, Menlo, Consolas, monospace">
    <g filter="url(#shadow)">
      <g transform="translate(0, 0)">
        <rect width="120" height="44" rx="8" fill="#1c1c1c" stroke="#3a3a3a"/>
        <circle cx="22" cy="22" r="11" fill="none" stroke="#9cdcfe" stroke-width="2"/>
        <rect x="18" y="12" width="8" height="8" rx="2" fill="#9cdcfe"/>
        <text x="42" y="19" font-size="11" fill="#c2e6fb">watch A</text>
        <text x="42" y="34" font-size="9" fill="#6f6f6f">non-IID</text>
      </g>
      <g transform="translate(0, 56)">
        <rect width="120" height="44" rx="8" fill="#1c1c1c" stroke="#3a3a3a"/>
        <circle cx="22" cy="22" r="11" fill="none" stroke="#9cdcfe" stroke-width="2"/>
        <rect x="18" y="12" width="8" height="8" rx="2" fill="#9cdcfe"/>
        <text x="42" y="19" font-size="11" fill="#c2e6fb">watch B</text>
        <text x="42" y="34" font-size="9" fill="#6f6f6f">non-IID</text>
      </g>
      <g transform="translate(0, 112)">
        <rect width="120" height="44" rx="8" fill="#1c1c1c" stroke="#3a3a3a"/>
        <path d="M 12 22 a 10 10 0 0 1 20 0 l 2 0 a 4 4 0 0 1 0 8 l -24 0 a 4 4 0 0 1 0 -8 z" fill="none" stroke="#9cdcfe" stroke-width="2"/>
        <text x="42" y="19" font-size="11" fill="#c2e6fb">earable</text>
        <text x="42" y="34" font-size="9" fill="#6f6f6f">IMU</text>
      </g>
      <g transform="translate(0, 168)">
        <rect width="120" height="44" rx="8" fill="#1c1c1c" stroke="#3a3a3a"/>
        <path d="M 12 22 a 10 10 0 0 1 20 0 l 2 0 a 4 4 0 0 1 0 8 l -24 0 a 4 4 0 0 1 0 -8 z" fill="none" stroke="#9cdcfe" stroke-width="2"/>
        <text x="42" y="19" font-size="11" fill="#c2e6fb">earable</text>
        <text x="42" y="34" font-size="9" fill="#6f6f6f">IMU</text>
      </g>
    </g>
  </g>

  <!-- connectors -->
  <g stroke="#9cdcfe" stroke-width="1.5" stroke-dasharray="4 4" stroke-opacity="0.55" fill="none">
    <line x1="756" y1="144" x2="884" y2="200"/>
    <line x1="756" y1="200" x2="884" y2="200"/>
    <line x1="756" y1="256" x2="884" y2="200"/>
    <line x1="756" y1="312" x2="884" y2="200"/>
  </g>

  <!-- Flower server -->
  <g transform="translate(884, 132)" filter="url(#glowf)">
    <rect width="220" height="136" rx="10" fill="#0d2438" stroke="#9cdcfe" stroke-width="2.5"/>
    <rect width="220" height="8" rx="4" fill="#9cdcfe" opacity="0.9"/>
    <g font-family="ui-monospace, Menlo, Consolas, monospace">
      <text x="110" y="32" text-anchor="middle" font-size="14" fill="#ffffff">Flower server</text>
      <text x="110" y="56" text-anchor="middle" font-size="10" fill="#8a8a8a">gated sensor fusion</text>
      <text x="110" y="74" text-anchor="middle" font-size="10" fill="#8a8a8a">BiLSTM · on-device</text>
      <text x="110" y="106" text-anchor="middle" font-size="24" font-weight="700" fill="#c2e6fb">87.97%</text>
      <text x="110" y="124" text-anchor="middle" font-size="10" fill="#9cdcfe">global model accuracy</text>
    </g>
  </g>

  <!-- beats badges -->
  <g font-family="ui-monospace, Menlo, Consolas, monospace" font-size="10.5">
    <g transform="translate(1130, 140)">
      <rect width="132" height="24" rx="12" fill="#1a1a1a" stroke="#f44747" stroke-opacity="0.6"/>
      <text x="66" y="17" text-anchor="middle" fill="#f48c8c">beats FedProx</text>
    </g>
    <g transform="translate(1130, 172)">
      <rect width="132" height="24" rx="12" fill="#1a1a1a" stroke="#f44747" stroke-opacity="0.6"/>
      <text x="66" y="17" text-anchor="middle" fill="#f48c8c">beats FedPer</text>
    </g>
    <g transform="translate(1130, 204)">
      <rect width="132" height="24" rx="12" fill="#1a1a1a" stroke="#f44747" stroke-opacity="0.6"/>
      <text x="66" y="17" text-anchor="middle" fill="#f48c8c">beats ClusterFL</text>
    </g>
    <g transform="translate(1282, 140)">
      <rect width="108" height="24" rx="12" fill="#1a1a1a" stroke="#9cdcfe" stroke-opacity="0.5"/>
      <text x="54" y="17" text-anchor="middle" fill="#c2e6fb">ACM ’26</text>
    </g>
  </g>

  <!-- metric chips -->
  <g font-family="ui-monospace, Menlo, Consolas, monospace">
    <g transform="translate(1236, 244)">
      <rect width="154" height="40" rx="6" fill="#151515" stroke="#9cdcfe" stroke-opacity="0.5"/>
      <text x="77" y="18" text-anchor="middle" font-size="12.5" fill="#c2e6fb">on-device privacy</text>
      <text x="77" y="33" text-anchor="middle" font-size="10" fill="#6f6f6f">raw data never leaves</text>
    </g>
    <g transform="translate(1402, 244)">
      <rect width="150" height="40" rx="6" fill="#151515" stroke="#9cdcfe" stroke-opacity="0.5"/>
      <text x="75" y="18" text-anchor="middle" font-size="12.5" fill="#c2e6fb">multi-sensor IMU</text>
      <text x="75" y="33" text-anchor="middle" font-size="10" fill="#6f6f6f">smartwatch + earables</text>
    </g>
  </g>

  <line x1="0" y1="340" x2="1600" y2="340" stroke="#9cdcfe" stroke-opacity="0.22" stroke-width="2"/>
</svg>