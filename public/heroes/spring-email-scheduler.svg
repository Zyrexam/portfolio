<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 400" width="1600" height="400">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1e1e1e"/><stop offset="1" stop-color="#101010"/>
    </linearGradient>
    <radialGradient id="glow" cx="64%" cy="46%" r="58%">
      <stop offset="0%" stop-color="#ce9178" stop-opacity="0.16"/>
      <stop offset="55%" stop-color="#ce9178" stop-opacity="0.05"/>
      <stop offset="100%" stop-color="#101010" stop-opacity="0"/>
    </radialGradient>
    <pattern id="dots" width="26" height="26" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="1" fill="#262626"/>
    </pattern>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="3" stdDeviation="5" flood-color="#000000" flood-opacity="0.55"/>
    </filter>
    <filter id="glowf" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="7" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <marker id="aw" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#9aa5b1"/>
    </marker>
  </defs>

  <rect width="1600" height="400" fill="url(#bg)"/>
  <rect width="1600" height="400" fill="url(#glow)"/>
  <rect width="1600" height="400" fill="url(#dots)"/>

  <!-- Title block -->
  <g font-family="ui-monospace, Menlo, Consolas, monospace">
    <text x="56" y="118" font-size="11" fill="#626262" letter-spacing="1.5">~/projects/spring-emailscheduler</text>
    <text x="56" y="158" font-size="27" font-weight="700" fill="#f5f5f5">Spring Email Scheduler</text>
    <text x="56" y="184" font-size="13" fill="#8f8f8f">timezone-aware jobs · Quartz JDBC store · crash recovery</text>
  </g>
  <g font-family="ui-monospace, Menlo, Consolas, monospace" font-size="11">
    <rect x="56" y="202" width="88" height="22" rx="4" fill="#212121" stroke="#ce9178" stroke-opacity="0.45"/>
    <text x="100" y="217" text-anchor="middle" fill="#e0b49d">Java 17</text>
    <rect x="154" y="202" width="102" height="22" rx="4" fill="#212121" stroke="#ce9178" stroke-opacity="0.45"/>
    <text x="205" y="217" text-anchor="middle" fill="#e0b49d">Spring Boot 3</text>
    <rect x="266" y="202" width="76" height="22" rx="4" fill="#212121" stroke="#ce9178" stroke-opacity="0.45"/>
    <text x="304" y="217" text-anchor="middle" fill="#e0b49d">Quartz</text>
    <rect x="352" y="202" width="76" height="22" rx="4" fill="#212121" stroke="#ce9178" stroke-opacity="0.45"/>
    <text x="390" y="217" text-anchor="middle" fill="#e0b49d">MySQL</text>
  </g>

  <!-- clock face -->
  <g transform="translate(636, 128)">
    <circle cx="62" cy="62" r="54" fill="#1a1a1a" stroke="#ce9178" stroke-width="3"/>
    <circle cx="62" cy="62" r="46" fill="none" stroke="#3a3a3a" stroke-width="1"/>
    <g stroke="#7a7a7a" stroke-width="2">
      <line x1="62" y1="18" x2="62" y2="26"/><line x1="62" y1="98" x2="62" y2="106"/>
      <line x1="18" y1="62" x2="26" y2="62"/><line x1="98" y1="62" x2="106" y2="62"/>
    </g>
    <line x1="62" y1="62" x2="62" y2="32" stroke="#ce9178" stroke-width="3" stroke-linecap="round"/>
    <line x1="62" y1="62" x2="84" y2="52" stroke="#ce9178" stroke-width="2.5" stroke-linecap="round"/>
    <circle cx="62" cy="62" r="4" fill="#ce9178"/>
    <text x="62" y="140" text-anchor="middle" font-size="12" fill="#e0b49d">TZ-aware</text>
  </g>

  <!-- arrow -->
  <g transform="translate(776, 190)">
    <line x1="0" y1="0" x2="34" y2="0" stroke="#9aa5b1" stroke-width="2" marker-end="url(#aw)"/>
  </g>

  <!-- job timeline -->
  <g transform="translate(836, 116)" font-family="ui-monospace, Menlo, Consolas, monospace">
    <g font-size="11" fill="#8a8a8a">
      <text x="0" y="14">IST</text><text x="76" y="14">EST</text><text x="152" y="14">PST</text>
    </g>
    <g stroke="#2c2c2c" stroke-width="1.5">
      <line x1="0" y1="22" x2="0" y2="150"/><line x1="76" y1="22" x2="76" y2="150"/><line x1="152" y1="22" x2="152" y2="150"/>
    </g>
    <line x1="0" y1="22" x2="228" y2="22" stroke="#2c2c2c"/>
    <line x1="0" y1="150" x2="228" y2="150" stroke="#2c2c2c"/>
    <!-- pending (blue), sent (teal), retry (yellow), failed (red) -->
    <circle cx="0" cy="34" r="6" fill="#569cd6"/><circle cx="0" cy="62" r="6" fill="#4ec9b0"/><circle cx="0" cy="90" r="6" fill="#dcdcaa"/>
    <circle cx="76" cy="42" r="6" fill="#4ec9b0"/><circle cx="76" cy="70" r="6" fill="#569cd6"/><circle cx="76" cy="108" r="6" fill="#f44747"/>
    <circle cx="152" cy="30" r="6" fill="#4ec9b0"/><circle cx="152" cy="58" r="6" fill="#dcdcaa"/><circle cx="152" cy="96" r="6" fill="#569cd6"/>
    <!-- retry pulse -->
    <circle cx="0" cy="118" r="6" fill="#dcdcaa" stroke="#dcdcaa" stroke-opacity="0.5" stroke-width="2"/>
    <text x="14" y="122" font-size="10" fill="#b9b9b9">retry 30s</text>
    <text x="66" y="170" font-size="10" fill="#6f6f6f">50+ jobs · &lt;1s delay</text>
  </g>

  <!-- envelope -->
  <g transform="translate(1148, 150)" filter="url(#shadow)">
    <rect width="120" height="80" rx="8" fill="#1c1c1c" stroke="#ce9178" stroke-width="2.5"/>
    <path d="M 8 12 L 60 44 L 112 12" fill="none" stroke="#ce9178" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="60" y="70" text-anchor="middle" font-size="11" fill="#e0b49d">Spring Mail</text>
  </g>
  <g font-family="ui-monospace, Menlo, Consolas, monospace" font-size="11.5" fill="#8a8a8a">
    <text x="1150" y="252">Gmail SMTP</text>
    <text x="1150" y="270">templates: WELCOME · REMINDER</text>
  </g>

  <!-- metric chips -->
  <g font-family="ui-monospace, Menlo, Consolas, monospace">
    <g transform="translate(1236, 150)">
      <rect width="150" height="44" rx="6" fill="#151515" stroke="#ce9178" stroke-opacity="0.55"/>
      <text x="75" y="20" text-anchor="middle" font-size="19" font-weight="700" fill="#eac9b6">50+</text>
      <text x="75" y="36" text-anchor="middle" font-size="10.5" fill="#8a8a8a">concurrent jobs</text>
    </g>
    <g transform="translate(1402, 150)">
      <rect width="150" height="44" rx="6" fill="#151515" stroke="#ce9178" stroke-opacity="0.55"/>
      <text x="75" y="20" text-anchor="middle" font-size="19" font-weight="700" fill="#eac9b6">3 × 30s</text>
      <text x="75" y="36" text-anchor="middle" font-size="10.5" fill="#8a8a8a">retry policy</text>
    </g>
    <g transform="translate(1236, 208)">
      <rect width="316" height="40" rx="6" fill="#151515" stroke="#ce9178" stroke-opacity="0.4"/>
      <text x="158" y="18" text-anchor="middle" font-size="12.5" fill="#b9b9b9">Quartz JDBC store</text>
      <text x="158" y="33" text-anchor="middle" font-size="10.5" fill="#6f6f6f">jobs survive restarts · auto-recover misfires</text>
    </g>
    <g transform="translate(1236, 262)">
      <rect width="316" height="40" rx="6" fill="#151515" stroke="#ce9178" stroke-opacity="0.4"/>
      <text x="158" y="18" text-anchor="middle" font-size="12.5" fill="#b9b9b9">PENDING → SENT | FAILED | CANCELLED</text>
      <text x="158" y="33" text-anchor="middle" font-size="10.5" fill="#6f6f6f">live lifecycle · single-file UI</text>
    </g>
  </g>

  <line x1="0" y1="340" x2="1600" y2="340" stroke="#ce9178" stroke-opacity="0.22" stroke-width="2"/>
</svg>