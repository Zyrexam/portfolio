<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 400" width="1600" height="400">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1e1e1e"/><stop offset="1" stop-color="#0d141c"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#252526" stroke-width="0.5"/>
    </pattern>
  </defs>
  <rect width="1600" height="400" fill="url(#bg)"/>
  <rect width="1600" height="400" fill="url(#grid)"/>

  <g font-family="ui-monospace, Menlo, Consolas, monospace" font-size="12">
    <circle cx="40" cy="40" r="3.5" fill="#007acc"/>
    <text x="54" y="44" fill="#858585">~/projects/url-shortener</text>
  </g>

  <!-- Long URL on left, short code on right -->
  <g transform="translate(40, 130)" font-family="ui-monospace, Menlo, Consolas, monospace">
    <text x="0" y="-10" font-size="11" fill="#858585">// POST /shorten  →  302 redirect</text>

    <text x="0" y="22" font-size="11" fill="#858585">long URL</text>
    <rect x="0" y="30" width="440" height="34" rx="4" fill="#252526" stroke="#3c3c3c"/>
    <text x="14" y="52" font-size="12" fill="#9cdcfe">https://github.com/Zyrexam/payment-idempotency-proxy</text>
    <text x="426" y="52" text-anchor="end" font-size="11" fill="#858585">…</text>

    <!-- Arrow -->
    <g transform="translate(470, 47)">
      <line x1="0" y1="0" x2="60" y2="0" stroke="#007acc" stroke-width="2"/>
      <path d="M 60 -6 L 72 0 L 60 6 z" fill="#007acc"/>
      <text x="36" y="-10" text-anchor="middle" font-size="10" fill="#007acc">shorten</text>
    </g>

    <text x="560" y="22" font-size="11" fill="#858585">short code</text>
    <rect x="560" y="30" width="200" height="34" rx="4" fill="#0e639c"/>
    <text x="660" y="53" text-anchor="middle" font-size="14" font-weight="700" fill="#ffffff">aB3xZ9</text>
  </g>

  <!-- Storage layer -->
  <g transform="translate(40, 230)" font-family="ui-monospace, Menlo, Consolas, monospace">
    <text x="0" y="-10" font-size="11" fill="#858585">// storage  ·  idempotent on duplicates</text>

    <rect x="0" y="0" width="180" height="80" rx="4" fill="#252526" stroke="#3c3c3c"/>
    <text x="90" y="22" text-anchor="middle" font-size="12" fill="#858585">Snowflake ID</text>
    <text x="90" y="44" text-anchor="middle" font-size="12" font-weight="600" fill="#007acc">base62</text>
    <text x="90" y="66" text-anchor="middle" font-size="11" fill="#858585">ID generator</text>

    <rect x="200" y="0" width="180" height="80" rx="4" fill="#252526" stroke="#3c3c3c"/>
    <text x="290" y="22" text-anchor="middle" font-size="12" fill="#858585">PostgreSQL</text>
    <text x="290" y="44" text-anchor="middle" font-size="11" fill="#858585">code → url</text>
    <text x="290" y="66" text-anchor="middle" font-size="11" fill="#858585">async SQLAlchemy</text>

    <rect x="400" y="0" width="180" height="80" rx="4" fill="#252526" stroke="#007acc" stroke-width="1.5"/>
    <text x="490" y="22" text-anchor="middle" font-size="12" fill="#858585">Redis cache</text>
    <text x="490" y="44" text-anchor="middle" font-size="11" fill="#007acc">1h TTL</text>
    <text x="490" y="66" text-anchor="middle" font-size="11" fill="#858585">single-flight lock</text>

    <rect x="600" y="0" width="180" height="80" rx="4" fill="#252526" stroke="#3c3c3c"/>
    <text x="690" y="22" text-anchor="middle" font-size="12" fill="#858585">SlowAPI</text>
    <text x="690" y="44" text-anchor="middle" font-size="11" fill="#f44747">5 r/s GET</text>
    <text x="690" y="66" text-anchor="middle" font-size="11" fill="#f44747">1 r/s POST</text>
  </g>

  <!-- Right: stack + redirect demo -->
  <g transform="translate(850, 130)" font-family="ui-monospace, Menlo, Consolas, monospace">
    <text x="0" y="0" font-size="12" fill="#858585">// 302 redirect</text>
    <text x="0" y="28" font-size="13" fill="#9cdcfe">$ curl -i localhost:8001/aB3xZ9</text>
    <text x="0" y="48" font-size="11" fill="#4ec9b0">HTTP/1.1 302 Found</text>
    <text x="0" y="66" font-size="11" fill="#4ec9b0">Location: https://github.com/...</text>
  </g>

  <g transform="translate(850, 230)" font-family="ui-monospace, Menlo, Consolas, monospace">
    <text x="0" y="0" font-size="12" fill="#858585">// stack</text>
    <text x="0" y="26" font-size="13" fill="#ffffff">FastAPI</text>
    <text x="0" y="48" font-size="13" fill="#cccccc">PostgreSQL · Redis</text>
    <text x="0" y="70" font-size="13" fill="#cccccc">SlowAPI · Snowflake</text>
  </g>

  <!-- Title overlay bottom-right -->
  <g font-family="ui-monospace, Menlo, Consolas, monospace" text-anchor="end">
    <text x="1560" y="62" font-size="22" font-weight="700" fill="#ffffff">URL Shortener</text>
    <text x="1560" y="86" font-size="12" fill="#007acc">FastAPI  ·  Snowflake IDs  ·  Redis  ·  PostgreSQL</text>
  </g>
</svg>