<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 400" width="1600" height="400">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1e1e1e"/><stop offset="1" stop-color="#101010"/>
    </linearGradient>
    <radialGradient id="glow" cx="64%" cy="46%" r="58%">
      <stop offset="0%" stop-color="#569cd6" stop-opacity="0.16"/>
      <stop offset="55%" stop-color="#569cd6" stop-opacity="0.05"/>
      <stop offset="100%" stop-color="#101010" stop-opacity="0"/>
    </radialGradient>
    <pattern id="dots" width="26" height="26" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="1" fill="#262626"/>
    </pattern>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="3" stdDeviation="5" flood-color="#000000" flood-opacity="0.55"/>
    </filter>
    <filter id="glowf" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="7" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <marker id="aw" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#9aa5b1"/>
    </marker>
  </defs>

  <rect width="1600" height="400" fill="url(#bg)"/>
  <rect width="1600" height="400" fill="url(#glow)"/>
  <rect width="1600" height="400" fill="url(#dots)"/>

  <!-- Title block -->
  <g font-family="ui-monospace, Menlo, Consolas, monospace">
    <text x="56" y="118" font-size="11" fill="#626262" letter-spacing="1.5">~/projects/turbotts-proxy</text>
    <text x="56" y="158" font-size="27" font-weight="700" fill="#f5f5f5">TurboTTS-Proxy</text>
    <text x="56" y="184" font-size="13" fill="#8f8f8f">gRPC caching proxy · 320ms → &lt;2ms time-to-first-audio-byte</text>
  </g>
  <g font-family="ui-monospace, Menlo, Consolas, monospace" font-size="11">
    <rect x="56" y="202" width="54" height="22" rx="4" fill="#212121" stroke="#569cd6" stroke-opacity="0.45"/>
    <text x="83" y="217" text-anchor="middle" fill="#9cc8ec">Go</text>
    <rect x="120" y="202" width="62" height="22" rx="4" fill="#212121" stroke="#569cd6" stroke-opacity="0.45"/>
    <text x="151" y="217" text-anchor="middle" fill="#9cc8ec">gRPC</text>
    <rect x="192" y="202" width="70" height="22" rx="4" fill="#212121" stroke="#569cd6" stroke-opacity="0.45"/>
    <text x="227" y="217" text-anchor="middle" fill="#9cc8ec">Redis</text>
    <rect x="272" y="202" width="102" height="22" rx="4" fill="#212121" stroke="#569cd6" stroke-opacity="0.45"/>
    <text x="323" y="217" text-anchor="middle" fill="#9cc8ec">HTTP/2</text>
    <rect x="384" y="202" width="104" height="22" rx="4" fill="#212121" stroke="#569cd6" stroke-opacity="0.45"/>
    <text x="436" y="217" text-anchor="middle" fill="#9cc8ec">Kubernetes</text>
  </g>

  <!-- latency comparison -->
  <g font-family="ui-monospace, Menlo, Consolas, monospace">
    <text x="636" y="128" font-size="12" fill="#6b6b6b">cold time-to-first-audio-byte</text>

    <!-- OpenAI bar -->
    <rect x="636" y="140" width="500" height="30" rx="5" fill="#2a1616" stroke="#f44747" stroke-opacity="0.5"/>
    <rect x="636" y="140" width="500" height="30" rx="5" fill="#f44747" opacity="0.85" style="filter: drop-shadow(0 0 8px rgba(244,71,71,0.4))"/>
    <text x="652" y="160" font-size="13" fill="#ffffff">OpenAI TTS · 320ms</text>
    <text x="1126" y="160" text-anchor="end" font-size="12" fill="#f48c8c">cold</text>

    <!-- Proxy bar -->
    <rect x="636" y="184" width="44" height="30" rx="5" fill="#0d2438" stroke="#569cd6" stroke-opacity="0.7"/>
    <rect x="636" y="184" width="44" height="30" rx="5" fill="#569cd6" style="filter: url(#glowf)"/>
    <text x="652" y="204" font-size="13" fill="#0a1520">2ms</text>
    <text x="692" y="204" font-size="12.5" fill="#9cc8ec">TurboTTS-Proxy · cache hit</text>
    <text x="1126" y="204" text-anchor="end" font-size="12" fill="#9cc8ec">−99%</text>
  </g>

  <!-- waveform -->
  <g transform="translate(636, 236)" fill="none" stroke="#569cd6" stroke-width="2" stroke-opacity="0.5">
    <path d="M 0 6 L 14 6 L 20 0 L 28 12 L 36 2 L 44 10 L 52 4 L 60 10 L 68 0 L 76 12 L 84 4 L 92 8 L 100 2 L 108 10 L 116 6 L 130 6"/>
  </g>

  <!-- gRPC chain -->
  <g transform="translate(636, 262)" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="12">
    <g filter="url(#shadow)">
      <rect width="110" height="38" rx="6" fill="#1c1c1c" stroke="#3c3c3c"/>
      <text x="55" y="24" text-anchor="middle" fill="#b8b8b8">client</text>
      <rect x="150" width="130" height="38" rx="6" fill="#0d2438" stroke="#569cd6"/>
      <text x="215" y="24" text-anchor="middle" fill="#9cc8ec">proxy (Go)</text>
      <rect x="320" width="130" height="38" rx="6" fill="#1c1c1c" stroke="#3c3c3c"/>
      <text x="385" y="24" text-anchor="middle" fill="#b8b8b8">OpenAI TTS</text>
    </g>
    <g stroke="#9aa5b1" stroke-width="2" fill="none">
      <line x1="110" y1="19" x2="148" y2="19" marker-end="url(#aw)"/>
      <line x1="280" y1="19" x2="318" y2="19" marker-end="url(#aw)"/>
    </g>
    <text x="129" y="12" text-anchor="middle" font-size="9.5" fill="#6f6f6f">stream</text>
    <text x="299" y="12" text-anchor="middle" font-size="9.5" fill="#6f6f6f">miss →</text>
  </g>

  <!-- metric chips -->
  <g font-family="ui-monospace, Menlo, Consolas, monospace">
    <g transform="translate(1236, 140)">
      <rect width="316" height="40" rx="6" fill="#151515" stroke="#569cd6" stroke-opacity="0.55"/>
      <text x="158" y="18" text-anchor="middle" font-size="13.5" fill="#9cc8ec">SHA-256 (text + voice + params)</text>
      <text x="158" y="33" text-anchor="middle" font-size="10.5" fill="#6f6f6f">cache key · Redis</text>
    </g>
    <g transform="translate(1236, 194)">
      <rect width="316" height="40" rx="6" fill="#151515" stroke="#569cd6" stroke-opacity="0.55"/>
      <text x="158" y="18" text-anchor="middle" font-size="13.5" fill="#9cc8ec">chunked binary streaming</text>
      <text x="158" y="33" text-anchor="middle" font-size="10.5" fill="#6f6f6f">HTTP/2 · small connection pool</text>
    </g>
    <g transform="translate(1236, 248)">
      <rect width="316" height="40" rx="6" fill="#151515" stroke="#569cd6" stroke-opacity="0.55"/>
      <text x="158" y="18" text-anchor="middle" font-size="13.5" fill="#9cc8ec">async cache warm on miss</text>
      <text x="158" y="33" text-anchor="middle" font-size="10.5" fill="#6f6f6f">next hit · near-instant</text>
    </g>
  </g>

  <line x1="0" y1="340" x2="1600" y2="340" stroke="#569cd6" stroke-opacity="0.22" stroke-width="2"/>
</svg>