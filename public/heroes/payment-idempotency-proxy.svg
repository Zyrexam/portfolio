<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 400" width="1600" height="400">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1e1e1e"/><stop offset="1" stop-color="#101010"/>
    </linearGradient>
    <radialGradient id="glow" cx="66%" cy="46%" r="58%">
      <stop offset="0%" stop-color="#4ec9b0" stop-opacity="0.16"/>
      <stop offset="55%" stop-color="#4ec9b0" stop-opacity="0.05"/>
      <stop offset="100%" stop-color="#101010" stop-opacity="0"/>
    </radialGradient>
    <pattern id="dots" width="26" height="26" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="1" fill="#262626"/>
    </pattern>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="3" stdDeviation="5" flood-color="#000000" flood-opacity="0.55"/>
    </filter>
    <filter id="glowf" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="8" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <marker id="aw" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4ec9b0"/>
    </marker>
  </defs>

  <rect width="1600" height="400" fill="url(#bg)"/>
  <rect width="1600" height="400" fill="url(#glow)"/>
  <rect width="1600" height="400" fill="url(#dots)"/>

  <!-- Title block -->
  <g font-family="ui-monospace, Menlo, Consolas, monospace">
    <text x="56" y="118" font-size="11" fill="#626262" letter-spacing="1.5">~/projects/payment-idempotency-proxy</text>
    <text x="56" y="158" font-size="27" font-weight="700" fill="#f5f5f5">Payment Idempotency Proxy</text>
    <text x="56" y="184" font-size="13" fill="#8f8f8f">exactly-once payment execution · Redis SET NX + Lua</text>
  </g>
  <g font-family="ui-monospace, Menlo, Consolas, monospace" font-size="11">
    <rect x="56" y="202" width="78" height="22" rx="4" fill="#212121" stroke="#4ec9b0" stroke-opacity="0.45"/>
    <text x="95" y="217" text-anchor="middle" fill="#7fe3c9">FastAPI</text>
    <rect x="144" y="202" width="76" height="22" rx="4" fill="#212121" stroke="#4ec9b0" stroke-opacity="0.45"/>
    <text x="182" y="217" text-anchor="middle" fill="#7fe3c9">Redis</text>
    <rect x="230" y="202" width="96" height="22" rx="4" fill="#212121" stroke="#4ec9b0" stroke-opacity="0.45"/>
    <text x="278" y="217" text-anchor="middle" fill="#7fe3c9">PostgreSQL</text>
    <rect x="336" y="202" width="104" height="22" rx="4" fill="#212121" stroke="#4ec9b0" stroke-opacity="0.45"/>
    <text x="388" y="217" text-anchor="middle" fill="#7fe3c9">Prometheus</text>
  </g>

  <!-- 20 concurrent requests -->
  <g font-family="ui-monospace, Menlo, Consolas, monospace">
    <text x="636" y="130" font-size="12" fill="#6b6b6b">20 concurrent requests · same Idempotency-Key</text>
    <g fill="#3f6b5f">
      <circle cx="652" cy="146" r="7"/><circle cx="682" cy="146" r="7"/><circle cx="712" cy="146" r="7"/><circle cx="742" cy="146" r="7"/>
      <circle cx="652" cy="176" r="7"/><circle cx="682" cy="176" r="7"/><circle cx="712" cy="176" r="7"/><circle cx="742" cy="176" r="7"/>
      <circle cx="652" cy="206" r="7"/><circle cx="682" cy="206" r="7"/><circle cx="712" cy="206" r="7"/><circle cx="742" cy="206" r="7"/>
      <circle cx="652" cy="236" r="7"/><circle cx="682" cy="236" r="7"/><circle cx="712" cy="236" r="7"/><circle cx="742" cy="236" r="7"/>
      <circle cx="652" cy="266" r="7"/><circle cx="682" cy="266" r="7"/><circle cx="712" cy="266" r="7"/><circle cx="742" cy="266" r="7"/>
    </g>
    <text x="700" y="294" text-anchor="middle" font-size="12" fill="#7fe3c9">×20</text>

    <!-- convergence lines -->
    <g stroke="#4ec9b0" stroke-opacity="0.22" stroke-width="1.5" fill="none">
      <line x1="762" y1="150" x2="918" y2="200"/>
      <line x1="762" y1="180" x2="918" y2="200"/>
      <line x1="762" y1="210" x2="918" y2="200"/>
      <line x1="762" y1="240" x2="918" y2="200"/>
      <line x1="762" y1="270" x2="918" y2="200"/>
    </g>

    <!-- arrow to lock -->
    <line x1="918" y1="200" x2="972" y2="200" stroke="#4ec9b0" stroke-width="3" marker-end="url(#aw)"/>
  </g>

  <!-- padlock -->
  <g filter="url(#glowf)">
    <path d="M 1090 170 q 9 -30 42 -30 q 33 0 42 30" fill="none" stroke="#4ec9b0" stroke-width="7" stroke-linecap="round"/>
    <rect x="1058" y="192" width="148" height="108" rx="12" fill="#0d2b24" stroke="#4ec9b0" stroke-width="3"/>
    <rect x="1058" y="192" width="148" height="6" rx="3" fill="#4ec9b0" opacity="0.9"/>
    <circle cx="1132" cy="232" r="9" fill="#4ec9b0"/>
    <rect x="1127" y="240" width="10" height="26" rx="3" fill="#4ec9b0"/>
    <text x="1132" y="286" text-anchor="middle" font-size="15" font-weight="600" fill="#9ff0da">EXACTLY 1</text>
  </g>

  <!-- Redis / Lua chips -->
  <g font-family="ui-monospace, Menlo, Consolas, monospace" font-size="12">
    <g transform="translate(636, 306)">
      <rect width="150" height="26" rx="5" fill="#191919" stroke="#4ec9b0" stroke-opacity="0.5"/>
      <text x="75" y="18" text-anchor="middle" fill="#7fe3c9">SET NX lock · 30s</text>
    </g>
    <g transform="translate(798, 306)">
      <rect width="150" height="26" rx="5" fill="#191919" stroke="#4ec9b0" stroke-opacity="0.5"/>
      <text x="75" y="18" text-anchor="middle" fill="#7fe3c9">Lua atomic release</text>
    </g>
    <g transform="translate(960, 306)">
      <rect width="166" height="26" rx="5" fill="#191919" stroke="#4ec9b0" stroke-opacity="0.5"/>
      <text x="83" y="18" text-anchor="middle" fill="#7fe3c9">SHA-256 tamper check</text>
    </g>
  </g>

  <!-- metric chips -->
  <g font-family="ui-monospace, Menlo, Consolas, monospace">
    <g transform="translate(1246, 196)">
      <rect width="150" height="44" rx="6" fill="#151515" stroke="#4ec9b0" stroke-opacity="0.55"/>
      <text x="75" y="20" text-anchor="middle" font-size="19" font-weight="700" fill="#9ff0da">0</text>
      <text x="75" y="36" text-anchor="middle" font-size="10.5" fill="#8a8a8a">duplicate charges</text>
    </g>
    <g transform="translate(1412, 196)">
      <rect width="140" height="44" rx="6" fill="#151515" stroke="#4ec9b0" stroke-opacity="0.55"/>
      <text x="70" y="20" text-anchor="middle" font-size="19" font-weight="700" fill="#9ff0da">95.9%</text>
      <text x="70" y="36" text-anchor="middle" font-size="10.5" fill="#8a8a8a">cache hit rate</text>
    </g>
  </g>

  <line x1="0" y1="340" x2="1600" y2="340" stroke="#4ec9b0" stroke-opacity="0.22" stroke-width="2"/>
</svg>