<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 400" width="1600" height="400">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1e1e1e"/><stop offset="1" stop-color="#0a140f"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#252526" stroke-width="0.5"/>
    </pattern>
  </defs>
  <rect width="1600" height="400" fill="url(#bg)"/>
  <rect width="1600" height="400" fill="url(#grid)"/>

  <g font-family="ui-monospace, Menlo, Consolas, monospace" font-size="12">
    <circle cx="40" cy="40" r="3.5" fill="#4ec9b0"/>
    <text x="54" y="44" fill="#858585">~/projects/edgecraft-cdn</text>
  </g>

  <!-- CDN architecture: Client → Router → 3 Edges → Origin -->
  <g transform="translate(40, 130)" font-family="ui-monospace, Menlo, Consolas, monospace">
    <text x="0" y="-10" font-size="11" fill="#858585">// CDN topology  ·  router round-robins across 3 edge servers</text>

    <!-- Client -->
    <g transform="translate(0, 20)">
      <rect width="100" height="44" rx="5" fill="#252526" stroke="#3c3c3c"/>
      <text x="50" y="18" text-anchor="middle" font-size="10" fill="#858585">client</text>
      <text x="50" y="34" text-anchor="middle" font-size="11" fill="#cccccc">request</text>
    </g>

    <!-- Arrow to router -->
    <g transform="translate(110, 42)">
      <line x1="0" y1="0" x2="50" y2="0" stroke="#4ec9b0" stroke-width="2"/>
      <path d="M 50 -6 L 62 0 L 50 6 z" fill="#4ec9b0"/>
    </g>

    <!-- Router -->
    <g transform="translate(180, 10)">
      <rect width="140" height="60" rx="5" fill="#252526" stroke="#4ec9b0" stroke-width="2"/>
      <text x="70" y="22" text-anchor="middle" font-size="10" fill="#858585">router / load balancer</text>
      <text x="70" y="44" text-anchor="middle" font-size="12" font-weight="600" fill="#4ec9b0">round-robin</text>
    </g>

    <!-- Arrows to 3 edges -->
    <g stroke="#4ec9b0" stroke-width="1.5" fill="none">
      <line x1="250" y1="70" x2="350" y2="120"/>
      <line x1="250" y1="75" x2="600" y2="120"/>
      <line x1="250" y1="70" x2="850" y2="120"/>
    </g>

    <!-- 3 Edge Servers -->
    <g transform="translate(350, 130)">
      <rect width="220" height="100" rx="5" fill="#252526" stroke="#3c3c3c"/>
      <text x="110" y="20" text-anchor="middle" font-size="11" fill="#4ec9b0">edge: delhi</text>
      <text x="110" y="40" text-anchor="middle" font-size="10" fill="#858585">LRU + TTL cache</text>
      <text x="110" y="58" text-anchor="middle" font-size="9" fill="#858585">98.78% hit rate</text>
      <text x="110" y="78" text-anchor="middle" font-size="9" fill="#858585">26,143 req · 319 miss</text>
    </g>
    <g transform="translate(600, 130)">
      <rect width="220" height="100" rx="5" fill="#252526" stroke="#3c3c3c"/>
      <text x="110" y="20" text-anchor="middle" font-size="11" fill="#4ec9b0">edge: newyork</text>
      <text x="110" y="40" text-anchor="middle" font-size="10" fill="#858585">LRU + TTL cache</text>
      <text x="110" y="58" text-anchor="middle" font-size="9" fill="#858585">99.32% hit rate</text>
      <text x="110" y="78" text-anchor="middle" font-size="9" fill="#858585">53,130 req · 362 miss</text>
    </g>
    <g transform="translate(850, 130)">
      <rect width="220" height="100" rx="5" fill="#252526" stroke="#3c3c3c"/>
      <text x="110" y="20" text-anchor="middle" font-size="11" fill="#4ec9b0">edge: mumbai</text>
      <text x="110" y="40" text-anchor="middle" font-size="10" fill="#858585">LRU + TTL cache</text>
      <text x="110" y="58" text-anchor="middle" font-size="9" fill="#858585">98.46% hit rate</text>
      <text x="110" y="78" text-anchor="middle" font-size="9" fill="#858585">20,727 req · 319 miss</text>
    </g>
  </g>

  <!-- Right: benchmark stats -->
  <g transform="translate(1100, 130)" font-family="ui-monospace, Menlo, Consolas, monospace">
    <text x="0" y="-10" font-size="11" fill="#858585">// benchmark  ·  Zipf(α=1.2)  ·  100k req</text>

    <rect x="0" y="0" width="200" height="58" rx="4" fill="#252526" stroke="#3c3c3c"/>
    <text x="100" y="22" text-anchor="middle" font-size="11" fill="#858585">hit rate</text>
    <text x="100" y="46" text-anchor="middle" font-size="22" font-weight="700" fill="#4ec9b0">99%</text>
  </g>
  <g transform="translate(1320, 130)" font-family="ui-monospace, Menlo, Consolas, monospace">
    <rect x="0" y="0" width="200" height="58" rx="4" fill="#252526" stroke="#3c3c3c"/>
    <text x="100" y="22" text-anchor="middle" font-size="11" fill="#858585">throughput</text>
    <text x="100" y="46" text-anchor="middle" font-size="20" font-weight="700" fill="#4ec9b0">606k/s</text>
  </g>
  <g transform="translate(1100, 200)" font-family="ui-monospace, Menlo, Consolas, monospace">
    <rect x="0" y="0" width="200" height="58" rx="4" fill="#252526" stroke="#3c3c3c"/>
    <text x="100" y="22" text-anchor="middle" font-size="11" fill="#858585">origin offload</text>
    <text x="100" y="46" text-anchor="middle" font-size="22" font-weight="700" fill="#4ec9b0">99%</text>
  </g>
  <g transform="translate(1320, 200)" font-family="ui-monospace, Menlo, Consolas, monospace">
    <rect x="0" y="0" width="200" height="58" rx="4" fill="#252526" stroke="#3c3c3c"/>
    <text x="100" y="22" text-anchor="middle" font-size="11" fill="#858585">edges</text>
    <text x="100" y="46" text-anchor="middle" font-size="22" font-weight="700" fill="#4ec9b0">3</text>
  </g>

  <!-- Bottom strip -->
  <g font-family="ui-monospace, Menlo, Consolas, monospace" font-size="11" fill="#858585">
    <text x="40" y="350">C++17  ·  OOP header/implementation split  ·  LRU = doubly-linked list + hash map (O(1))  ·  TTL via std::chrono::steady_clock</text>
  </g>

  <!-- Title overlay bottom-right -->
  <g font-family="ui-monospace, Menlo, Consolas, monospace" text-anchor="end">
    <text x="1560" y="62" font-size="22" font-weight="700" fill="#ffffff">EdgeCraft-CDN</text>
    <text x="1560" y="86" font-size="12" fill="#4ec9b0">C++17  ·  LRU  ·  TTL  ·  Zipfian simulation</text>
  </g>
</svg>