<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 400" width="1600" height="400">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1e1e1e"/><stop offset="1" stop-color="#101010"/>
    </linearGradient>
    <radialGradient id="glow" cx="62%" cy="48%" r="60%">
      <stop offset="0%" stop-color="#dcdcaa" stop-opacity="0.14"/>
      <stop offset="55%" stop-color="#dcdcaa" stop-opacity="0.04"/>
      <stop offset="100%" stop-color="#101010" stop-opacity="0"/>
    </radialGradient>
    <pattern id="dots" width="26" height="26" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="1" fill="#262626"/>
    </pattern>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="3" stdDeviation="5" flood-color="#000000" flood-opacity="0.55"/>
    </filter>
    <linearGradient id="curvefill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#dcdcaa" stop-opacity="0.32"/>
      <stop offset="1" stop-color="#dcdcaa" stop-opacity="0.03"/>
    </linearGradient>
  </defs>

  <rect width="1600" height="400" fill="url(#bg)"/>
  <rect width="1600" height="400" fill="url(#glow)"/>
  <rect width="1600" height="400" fill="url(#dots)"/>

  <!-- Title block -->
  <g font-family="ui-monospace, Menlo, Consolas, monospace">
    <text x="56" y="118" font-size="11" fill="#626262" letter-spacing="1.5">~/projects/well-log-analyzer</text>
    <text x="56" y="158" font-size="27" font-weight="700" fill="#f5f5f5">Well-Log Analyzer · OneGeo</text>
    <text x="56" y="184" font-size="13" fill="#8f8f8f">LAS data platform · windowed downsampling · GeoBot assistant</text>
  </g>
  <g font-family="ui-monospace, Menlo, Consolas, monospace" font-size="11">
    <rect x="56" y="202" width="70" height="22" rx="4" fill="#212121" stroke="#dcdcaa" stroke-opacity="0.45"/>
    <text x="91" y="217" text-anchor="middle" fill="#e8e6c2">React</text>
    <rect x="136" y="202" width="80" height="22" rx="4" fill="#212121" stroke="#dcdcaa" stroke-opacity="0.45"/>
    <text x="176" y="217" text-anchor="middle" fill="#e8e6c2">FastAPI</text>
    <rect x="226" y="202" width="62" height="22" rx="4" fill="#212121" stroke="#dcdcaa" stroke-opacity="0.45"/>
    <text x="257" y="217" text-anchor="middle" fill="#e8e6c2">AWS S3</text>
    <rect x="298" y="202" width="78" height="22" rx="4" fill="#212121" stroke="#dcdcaa" stroke-opacity="0.45"/>
    <text x="337" y="217" text-anchor="middle" fill="#e8e6c2">Llama 3.3</text>
  </g>

  <!-- chart panel -->
  <g transform="translate(636, 118)" filter="url(#shadow)">
    <rect width="560" height="204" rx="8" fill="#141414" stroke="#2c2c2c"/>
    <g font-family="ui-monospace, Menlo, Consolas, monospace" font-size="11">
      <rect x="0" y="0" width="560" height="24" rx="8" fill="#1d1d1d"/>
      <circle cx="14" cy="12" r="3.5" fill="#ff5f56"/>
      <circle cx="26" cy="12" r="3.5" fill="#ffbd2e"/>
      <circle cx="38" cy="12" r="3.5" fill="#27c93f"/>
      <text x="56" y="16" fill="#626262">GR_RAW · depth log · 50,000+ rows</text>
    </g>

    <!-- gridlines -->
    <g stroke="#262626" stroke-width="1">
      <line x1="52" y1="44" x2="540" y2="44"/><line x1="52" y1="84" x2="540" y2="84"/>
      <line x1="52" y1="124" x2="540" y2="124"/><line x1="52" y1="164" x2="540" y2="164"/>
    </g>
    <g font-family="ui-monospace, Menlo, Consolas, monospace" font-size="9.5" fill="#5f5f5f">
      <text x="8" y="48">5.40k</text>
      <text x="8" y="88">5.41k</text>
      <text x="8" y="128">5.42k</text>
      <text x="8" y="168">5.43k</text>
    </g>

    <!-- gamma-ray curve with area fill -->
    <path d="M 52 164 C 70 110, 88 158, 104 158 C 120 158, 132 66, 150 120 C 168 174, 180 92, 196 124 C 212 156, 224 84, 240 110 C 256 136, 266 48, 282 76 C 298 104, 312 132, 326 96 C 340 60, 356 128, 370 140 C 384 152, 396 76, 412 104 C 428 132, 440 58, 456 88 C 472 118, 484 96, 500 72 C 516 48, 528 110, 540 92 L 540 190 L 52 190 Z" fill="url(#curvefill)"/>
    <path d="M 52 164 C 70 110, 88 158, 104 158 C 120 158, 132 66, 150 120 C 168 174, 180 92, 196 124 C 212 156, 224 84, 240 110 C 256 136, 266 48, 282 76 C 298 104, 312 132, 326 96 C 340 60, 356 128, 370 140 C 384 152, 396 76, 412 104 C 428 132, 440 58, 456 88 C 472 118, 484 96, 500 72 C 516 48, 528 110, 540 92" fill="none" stroke="#dcdcaa" stroke-width="2.5" style="filter: drop-shadow(0 0 6px rgba(220,220,170,0.35))"/>
    <circle cx="266" cy="48" r="5" fill="#dcdcaa"/>
    <line x1="266" y1="48" x2="266" y2="120" stroke="#dcdcaa" stroke-opacity="0.5" stroke-dasharray="4 4"/>
    <text x="276" y="44" font-size="10" fill="#e8e6c2">spike @ 5,420 ft</text>

    <!-- GeoBot bubble -->
    <g transform="translate(360, 148)">
      <rect width="176" height="52" rx="8" fill="#1d1d1d" stroke="#dcdcaa" stroke-opacity="0.55"/>
      <path d="M 28 52 L 20 68 L 44 52 Z" fill="#1d1d1d"/>
      <text x="12" y="20" font-size="10.5" fill="#8a8a8a">GeoBot</text>
      <text x="12" y="38" font-size="10.5" fill="#e8e6c2">potential: HIGH</text>
    </g>
  </g>

  <!-- stat chips -->
  <g font-family="ui-monospace, Menlo, Consolas, monospace">
    <g transform="translate(1236, 132)">
      <rect width="150" height="44" rx="6" fill="#151515" stroke="#dcdcaa" stroke-opacity="0.55"/>
      <text x="75" y="20" text-anchor="middle" font-size="18" font-weight="700" fill="#eceac8">50,000+</text>
      <text x="75" y="36" text-anchor="middle" font-size="10.5" fill="#8a8a8a">rows streamed</text>
    </g>
    <g transform="translate(1402, 132)">
      <rect width="150" height="44" rx="6" fill="#151515" stroke="#dcdcaa" stroke-opacity="0.55"/>
      <text x="75" y="20" text-anchor="middle" font-size="18" font-weight="700" fill="#eceac8">−90%</text>
      <text x="75" y="36" text-anchor="middle" font-size="10.5" fill="#8a8a8a">render latency</text>
    </g>
    <g transform="translate(1236, 190)">
      <rect width="316" height="40" rx="6" fill="#151515" stroke="#dcdcaa" stroke-opacity="0.4"/>
      <text x="158" y="18" text-anchor="middle" font-size="12.5" fill="#b9b9b9">windowed downsampling</text>
      <text x="158" y="33" text-anchor="middle" font-size="10.5" fill="#6f6f6f">viewport-sized sample · trends preserved</text>
    </g>
    <g transform="translate(1236, 246)">
      <rect width="316" height="40" rx="6" fill="#151515" stroke="#dcdcaa" stroke-opacity="0.4"/>
      <text x="158" y="18" text-anchor="middle" font-size="12.5" fill="#b9b9b9">10,000 rows/sec</text>
      <text x="158" y="33" text-anchor="middle" font-size="10.5" fill="#6f6f6f">async ingestion pipeline</text>
    </g>
  </g>

  <line x1="0" y1="340" x2="1600" y2="340" stroke="#dcdcaa" stroke-opacity="0.22" stroke-width="2"/>
</svg>