<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 400" width="1600" height="400">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1e1e1e"/><stop offset="1" stop-color="#101010"/>
    </linearGradient>
    <radialGradient id="glow" cx="64%" cy="46%" r="58%">
      <stop offset="0%" stop-color="#4ec9b0" stop-opacity="0.16"/>
      <stop offset="55%" stop-color="#4ec9b0" stop-opacity="0.05"/>
      <stop offset="100%" stop-color="#101010" stop-opacity="0"/>
    </radialGradient>
    <pattern id="dots" width="26" height="26" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="1" fill="#262626"/>
    </pattern>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="3" stdDeviation="5" flood-color="#000000" flood-opacity="0.55"/>
    </filter>
    <filter id="glowf" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <marker id="aw" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#9aa5b1"/>
    </marker>
  </defs>

  <rect width="1600" height="400" fill="url(#bg)"/>
  <rect width="1600" height="400" fill="url(#glow)"/>
  <rect width="1600" height="400" fill="url(#dots)"/>

  <!-- Title block -->
  <g font-family="ui-monospace, Menlo, Consolas, monospace">
    <text x="56" y="118" font-size="11" fill="#626262" letter-spacing="1.5">~/projects/smart-contract-pipeline</text>
    <text x="56" y="158" font-size="27" font-weight="700" fill="#f5f5f5">Smart Contract Pipeline</text>
    <text x="56" y="184" font-size="13" fill="#8f8f8f">NL → secure Solidity · static analysis · LLM auto-fix</text>
  </g>
  <g font-family="ui-monospace, Menlo, Consolas, monospace" font-size="11">
    <rect x="56" y="202" width="80" height="22" rx="4" fill="#212121" stroke="#4ec9b0" stroke-opacity="0.45"/>
    <text x="96" y="217" text-anchor="middle" fill="#7fe3c9">Solidity</text>
    <rect x="146" y="202" width="76" height="22" rx="4" fill="#212121" stroke="#4ec9b0" stroke-opacity="0.45"/>
    <text x="184" y="217" text-anchor="middle" fill="#7fe3c9">Docker</text>
    <rect x="232" y="202" width="70" height="22" rx="4" fill="#212121" stroke="#4ec9b0" stroke-opacity="0.45"/>
    <text x="267" y="217" text-anchor="middle" fill="#7fe3c9">Python</text>
    <rect x="312" y="202" width="88" height="22" rx="4" fill="#212121" stroke="#4ec9b0" stroke-opacity="0.45"/>
    <text x="356" y="217" text-anchor="middle" fill="#7fe3c9">LLM</text>
  </g>

  <!-- 3-stage pipeline -->
  <g font-family="ui-monospace, Menlo, Consolas, monospace" font-size="13">
    <g transform="translate(636, 148)" filter="url(#shadow)">
      <rect width="170" height="58" rx="8" fill="#1c1c1c" stroke="#3a3a3a"/>
      <text x="16" y="26" font-size="10" fill="#6f6f6f">stage 1</text>
      <text x="16" y="46" fill="#b9b9b9">intent extract</text>
    </g>
    <g transform="translate(836, 148)" filter="url(#shadow)">
      <rect width="170" height="58" rx="8" fill="#1c1c1c" stroke="#3a3a3a"/>
      <text x="16" y="26" font-size="10" fill="#6f6f6f">stage 2</text>
      <text x="16" y="46" fill="#b9b9b9">generate</text>
    </g>
    <g transform="translate(1036, 148)" filter="url(#shadow)">
      <rect width="170" height="58" rx="8" fill="#0d2b24" stroke="#4ec9b0" stroke-width="2"/>
      <rect width="170" height="4" rx="2" fill="#4ec9b0" opacity="0.9"/>
      <text x="16" y="26" font-size="10" fill="#7fe3c9">stage 3</text>
      <text x="16" y="46" fill="#9ff0da">harden</text>
    </g>
    <g stroke="#9aa5b1" stroke-width="2" fill="none">
      <line x1="806" y1="177" x2="834" y2="177" marker-end="url(#aw)"/>
      <line x1="1006" y1="177" x2="1034" y2="177" marker-end="url(#aw)"/>
    </g>

    <!-- LLM auto-fix loop -->
    <path d="M 1121 146 C 1150 96, 861 96, 861 146" fill="none" stroke="#4ec9b0" stroke-width="2.5" stroke-dasharray="7 5" marker-end="url(#aw)"/>
    <text x="991" y="96" text-anchor="middle" font-size="11.5" fill="#7fe3c9">LLM auto-fix · re-verify until clean</text>

    <!-- analyzers -->
    <g font-size="11.5">
      <g transform="translate(636, 226)">
        <rect width="92" height="28" rx="5" fill="#171717" stroke="#4ec9b0" stroke-opacity="0.5"/>
        <text x="46" y="19" text-anchor="middle" fill="#7fe3c9">Slither</text>
      </g>
      <g transform="translate(738, 226)">
        <rect width="92" height="28" rx="5" fill="#171717" stroke="#4ec9b0" stroke-opacity="0.5"/>
        <text x="46" y="19" text-anchor="middle" fill="#7fe3c9">Mythril</text>
      </g>
      <g transform="translate(840, 226)">
        <rect width="92" height="28" rx="5" fill="#171717" stroke="#4ec9b0" stroke-opacity="0.5"/>
        <text x="46" y="19" text-anchor="middle" fill="#7fe3c9">Semgrep</text>
      </g>
      <g transform="translate(942, 226)">
        <rect width="92" height="28" rx="5" fill="#171717" stroke="#4ec9b0" stroke-opacity="0.5"/>
        <text x="46" y="19" text-anchor="middle" fill="#7fe3c9">Solhint</text>
      </g>
    </g>

    <!-- severity row -->
    <g font-size="11" fill="#8a8a8a">
      <text x="636" y="278">severity-ranked: <tspan fill="#f44747">critical</tspan> · <tspan fill="#dcdcaa">high</tspan> · <tspan fill="#9cc8ec">medium</tspan></text>
    </g>
  </g>

  <!-- code snippet -->
  <g transform="translate(1236, 140)" filter="url(#shadow)">
    <rect width="316" height="150" rx="8" fill="#121212" stroke="#2c2c2c"/>
    <g font-family="ui-monospace, Menlo, Consolas, monospace" font-size="10.5">
      <rect x="0" y="0" width="316" height="22" rx="8" fill="#1d1d1d"/>
      <text x="12" y="15" fill="#626262">Escrow.sol · after hardening</text>
      <text x="12" y="46" fill="#c586c0">pragma</text><text x="66" y="46" fill="#9cdcfe"> solidity</text><text x="126" y="46" fill="#dcdcaa"> ^0.8.24;</text>
      <text x="12" y="64" fill="#569cd6">contract</text><text x="80" y="64" fill="#dcdcaa"> Escrow</text><text x="144" y="64" fill="#cccccc"> {</text>
      <text x="26" y="82" fill="#569cd6">mapping</text><text x="94" y="82" fill="#cccccc">(address =&gt; uint) </text><text x="196" y="82" fill="#9cdcfe">balances</text><text x="252" y="82" fill="#cccccc">;</text>
      <text x="26" y="100" fill="#c586c0">function</text><text x="92" y="100" fill="#9cdcfe"> release</text><text x="146" y="100" fill="#cccccc">() </text><text x="164" y="100" fill="#569cd6">external</text><text x="222" y="100" fill="#cccccc"> {</text>
      <text x="40" y="118" fill="#6a9955">// reentrancy-guarded ✓</text>
      <text x="26" y="136" fill="#cccccc">}</text>
    </g>
  </g>

  <!-- metric chips -->
  <g font-family="ui-monospace, Menlo, Consolas, monospace">
    <g transform="translate(1236, 306)">
      <rect width="150" height="34" rx="6" fill="#151515" stroke="#4ec9b0" stroke-opacity="0.5"/>
      <text x="75" y="22" text-anchor="middle" font-size="13" fill="#7fe3c9">3 stages</text>
    </g>
    <g transform="translate(1402, 306)">
      <rect width="150" height="34" rx="6" fill="#151515" stroke="#4ec9b0" stroke-opacity="0.5"/>
      <text x="75" y="22" text-anchor="middle" font-size="13" fill="#7fe3c9">4 analyzers</text>
    </g>
  </g>

  <line x1="0" y1="340" x2="1600" y2="340" stroke="#4ec9b0" stroke-opacity="0.22" stroke-width="2"/>
</svg>